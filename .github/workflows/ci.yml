# The harness is the CI: the checks live in scripts/harness.sh and every job runs a `make` target
# (docs/HARNESS.md). The images job builds with buildx + the GitHub Actions cache and then lets the
# harness check the prebuilt images (IMAGES_PREBUILT=1); e2e loads those exact images into kind.
# Job ids are stable required status checks (.github/rulesets/main.json): static, test, images, e2e,
# e2e-platform. Release publication is a separate manual workflow after these checks pass on main.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC: catches rot (expired ignores, new CVEs, moved URLs)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HARNESS_STRICT: '1'

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the full history

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/versions.env', 'tools/checksums.txt', 'scripts/lib/tools.sh') }}

      - run: make tools
      - run: make static

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        # postgres:17-alpine (verified 2026-10-10), same digest as compose.yaml, the local overlay and
        # the harness. Throwaway database that only lives for this job: the password is not a secret.
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: dx03v2_test
          POSTGRES_USER: dx03v2
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U dx03v2 -d dx03v2_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: github/codeql-action/init@48870fdd6b42ee6474ec4207209ff87609271a5e # v4.39.0
        with:
          languages: javascript-typescript
          queries: security-extended
          build-mode: none

      - uses: github/codeql-action/analyze@48870fdd6b42ee6474ec4207209ff87609271a5e # v4.39.0
        id: codeql
        with:
          output: ${{ runner.temp }}/codeql-results
          upload: never

      - name: Set CodeQL SARIF path for the harness
        run: printf 'CODEQL_SARIF_PATH=%s\n' "$RUNNER_TEMP/codeql-results" >> "$GITHUB_ENV"

      - run: make test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_NAME: dx03v2_test
          DB_USER: dx03v2
          DB_PASSWORD: postgres

      - name: Start disposable SonarQube and PostgreSQL
        run: bash scripts/sonar-service.sh start

      - name: Install SHA256-pinned SonarScanner CLI
        run: bash scripts/install-sonar-scanner.sh

      - name: Configure the disposable SonarQube project and gate
        env:
          SONAR_HOST_URL: http://127.0.0.1:9000
          SONAR_PROJECT_KEY: dx03v2
          SONAR_FIXTURE_PROJECT: dx03v2-gate-fixture
        run: bash scripts/sonar-bootstrap.sh

      - name: Scan and block on the SonarQube Quality Gate
        env:
          SONAR_HOST_URL: http://127.0.0.1:9000
        run: |
          "$SONAR_SCANNER" -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=600

      - name: Prove the SonarQube gate rejects uncovered code
        env:
          SONAR_HOST_URL: http://127.0.0.1:9000
          SONAR_FIXTURE_SOURCE: security/fixtures/sonar
          SONAR_FIXTURE_PROJECT: dx03v2-gate-fixture
        run: bash scripts/test-sonar-gate.sh

      - name: Stop disposable SonarQube and PostgreSQL
        if: always()
        run: bash scripts/sonar-service.sh stop

      - name: Upload CodeQL results for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dx03v2-codeql-sarif
          path: ${{ runner.temp }}/codeql-results/*.sarif
          retention-days: 7
          if-no-files-found: ignore

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/versions.env', 'tools/checksums.txt', 'scripts/lib/tools.sh') }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build dx03v2-api:e2e
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: api/Dockerfile
          build-args: |
            GIT_SHA=${{ github.sha }}
            SOURCE_REPOSITORY=${{ github.repository }}
          tags: dx03v2-api:e2e
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build dx03v2-web:e2e
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: web/Dockerfile
          build-args: |
            GIT_SHA=${{ github.sha }}
            SOURCE_REPOSITORY=${{ github.repository }}
          tags: dx03v2-web:e2e
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - run: make tools
      - run: make build # npm build, image policy and the trivy gate on the images built above
        env:
          IMAGES_PREBUILT: '1'

      - name: Run OWASP ZAP Baseline against the disposable app
        run: make dast
        env:
          ZAP_REPORT_DIR: ${{ runner.temp }}/dx03v2-zap-reports
          ZAP_TARGET_PORT: '18080'
          DAST_API_IMAGE: dx03v2-api:e2e
          DAST_WEB_IMAGE: dx03v2-web:e2e

      - name: Upload OWASP ZAP reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dx03v2-zap-reports
          path: ${{ runner.temp }}/dx03v2-zap-reports
          retention-days: 7
          if-no-files-found: ignore

      - name: Save both images as one artifact
        run: |
          set -euo pipefail
          docker save dx03v2-api:e2e dx03v2-web:e2e -o "$RUNNER_TEMP/dx03v2-images.tar"
          jq -n \
            --arg source_sha "$GITHUB_SHA" \
            --arg ci_run_id "$GITHUB_RUN_ID" \
            --arg ci_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg image_tar_sha256 "$(sha256sum "$RUNNER_TEMP/dx03v2-images.tar" | awk '{print $1}')" \
            --arg api_image_id "$(docker image inspect dx03v2-api:e2e --format '{{.Id}}')" \
            --arg web_image_id "$(docker image inspect dx03v2-web:e2e --format '{{.Id}}')" \
            '{schema_version: 1, source_sha: $source_sha, ci_run_id: $ci_run_id,
              ci_run_attempt: ($ci_run_attempt | tonumber), image_tar_sha256: $image_tar_sha256,
              images: {api: {tag: "dx03v2-api:e2e", image_id: $api_image_id},
                       web: {tag: "dx03v2-web:e2e", image_id: $web_image_id}}}' \
            >"$RUNNER_TEMP/dx03v2-image-manifest.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dx03v2-images
          path: |
            ${{ runner.temp }}/dx03v2-images.tar
            ${{ runner.temp }}/dx03v2-image-manifest.json
          retention-days: 14
          if-no-files-found: error

  e2e:
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install kind and kubectl (pinned, SHA256-verified)
        run: bash scripts/install-tools.sh kind kubectl

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dx03v2-images
          path: ${{ runner.temp }}

      - name: Load the images built by the images job
        run: docker load -i "$RUNNER_TEMP/dx03v2-images.tar"

      - run: make e2e
        env:
          E2E_SKIP_BUILD: '1'
          E2E_DIAGNOSTICS_DIR: ${{ runner.temp }}/e2e-diagnostics

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-diagnostics
          path: ${{ runner.temp }}/e2e-diagnostics
          retention-days: 7
          if-no-files-found: ignore

  # The app on the full local platform of tx03v2 (pinned commit, deploy/local/tx03v2.ref): kind +
  # emulated registry (Artifact Registry), database (Cloud SQL), object storage, load balancer and git
  # server, Istio ambient, Argo CD, Prometheus, Loki, Gatekeeper, Trivy Operator, Velero and Chaos
  # Mesh; deploy through GitOps and probes (scripts/e2e-platform.sh). Uses the images of the images
  # job. No cloud credentials.
  e2e-platform:
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install kubectl (pinned, SHA256-verified)
        run: bash scripts/install-tools.sh kubectl

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dx03v2-images
          path: ${{ runner.temp }}

      - name: Load the images built by the images job
        run: docker load -i "$RUNNER_TEMP/dx03v2-images.tar"

      - run: make e2e-platform
        env:
          E2E_SKIP_BUILD: '1'
          E2E_DIAGNOSTICS_DIR: ${{ runner.temp }}/platform-diagnostics
          # Optional repository variable of a fork: its own tx03v2 (FORK.md). Empty: the original.
          TX03V2_REPO: ${{ vars.TX03V2_REPO }}

      # The job log keeps only the tail of the run (the destroy); the full log shows the failed probe.
      # Sensitive Terraform values are never printed, and the lab credentials die with the runner.
      - name: Keep the full platform e2e log
        if: failure()
        env:
          DIAG_DIR: ${{ runner.temp }}/platform-diagnostics
          E2E_LOG: /tmp/dx03v2-harness/logs/platform-e2e.log
        run: |
          mkdir -p "$DIAG_DIR"
          if [[ -f "$E2E_LOG" ]]; then
            cp "$E2E_LOG" "$DIAG_DIR/"
          else
            echo "no platform e2e log to keep"
          fi

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-diagnostics
          path: ${{ runner.temp }}/platform-diagnostics
          retention-days: 7
          if-no-files-found: ignore

  continuity:
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dx03v2-images
          path: ${{ runner.temp }}
      - name: Verify and load the exact images built and scanned by CI
        env:
          IMAGE_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          manifest="$IMAGE_DIR/dx03v2-image-manifest.json"
          jq -e --arg sha "$GITHUB_SHA" '.source_sha == $sha' "$manifest"
          expected="$(jq -er '.image_tar_sha256' "$manifest")"
          actual="$(sha256sum "$IMAGE_DIR/dx03v2-images.tar" | awk '{print $1}')"
          [[ "$actual" == "$expected" ]]
          docker load -i "$IMAGE_DIR/dx03v2-images.tar"
          for app in api web; do
            expected="$(jq -er ".images.$app.image_id" "$manifest")"
            actual="$(docker image inspect "dx03v2-$app:e2e" --format '{{.Id}}')"
            [[ "$actual" == "$expected" ]]
          done
      - run: make continuity
        env:
          CONTINUITY_REPORT_DIR: ${{ runner.temp }}/continuity
          HARNESS_VERBOSE: '1'
      - name: Keep recovery measurements and failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: continuity
          path: ${{ runner.temp }}/continuity
          retention-days: 7
          if-no-files-found: error

  # The same platform e2e on the small size of tx03v2 (LOCAL_SIZE=small), inside a Docker daemon
  # limited to 7 GB without swap (Docker-in-Docker, scripts/e2e-platform-small.sh): the proof that a
  # laptop with 7 GB for Docker runs it (docs/LAB_LOCAL.md). It also reports any OOM kill. Not a
  # required check: e2e-platform (default size) is the gate.
  e2e-platform-small:
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the release rollback drill needs the parent commit

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dx03v2-images
          path: ${{ runner.temp }}

      - name: Load the images built by the images job
        run: docker load -i "$RUNNER_TEMP/dx03v2-images.tar"

      - run: make e2e-platform-small
        env:
          E2E_SKIP_BUILD: '1'
          E2E_DIAGNOSTICS_DIR: ${{ runner.temp }}/platform-diagnostics
          TX03V2_REPO: ${{ vars.TX03V2_REPO }}

      - name: Keep the full platform e2e log
        if: failure()
        env:
          DIAG_DIR: ${{ runner.temp }}/platform-diagnostics
          E2E_LOG: /tmp/dx03v2-harness/logs/platform-small-e2e.log
        run: |
          mkdir -p "$DIAG_DIR"
          if [[ -f "$E2E_LOG" ]]; then
            cp "$E2E_LOG" "$DIAG_DIR/"
          else
            echo "no platform e2e log to keep"
          fi

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-small-diagnostics
          path: ${{ runner.temp }}/platform-diagnostics
          retention-days: 7
          if-no-files-found: ignore
