# Cloud-mutating and billable: promote a signed GHCR release to Artifact Registry and deploy to GKE.
# Dispatch from main with the run id of a successful publish-images run. The release is verified
# before the lab environment approval and again before Google Cloud credentials are requested.
name: deploy-gcp

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful publish-images workflow run id for the release to deploy
        required: true
        type: string
      deploy_mode:
        description: Use Argo CD when available, or force the deployment path
        required: true
        default: auto
        type: choice
        options:
          - auto
          - gitops
          - push
      platform_profile:
        description: Must match the tx03v2 platform profile installed on GKE
        required: true
        default: core
        type: choice
        options:
          - core
          - full

permissions:
  contents: read

concurrency:
  group: dx03v2-lab-deploy
  cancel-in-progress: false

jobs:
  verify-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
    steps:
      - name: Require the deployment workflow from main
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]] || {
            echo "::error::deploy-gcp must run from main so the promotion signer has the pinned identity."
            exit 1
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the publisher run and release artifact
        id: release
        run: bash scripts/get-publish-run-metadata.sh

      - name: Download the immutable release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          run-id: ${{ steps.release.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/dx03v2-release

      - name: Verify source CI, image digests, SBOM checksums, and attestations
        env:
          RELEASE_DIR: ${{ runner.temp }}/dx03v2-release
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: bash scripts/verify-release-bundle.sh

      - name: Preserve the verified bundle for the approved deploy job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dx03v2-verified-release
          path: ${{ runner.temp }}/dx03v2-release/
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: verify-release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: lab
    permissions:
      actions: read
      attestations: write
      artifact-metadata: write
      contents: write
      id-token: write
      packages: read
    env:
      DEPLOY_MODE: ${{ inputs.deploy_mode }}
      PLATFORM_PROFILE: ${{ inputs.platform_profile }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download the previously verified release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dx03v2-verified-release
          path: ${{ runner.temp }}/dx03v2-release

      - name: Re-verify the bundle and signer before requesting Google Cloud credentials
        env:
          RELEASE_DIR: ${{ runner.temp }}/dx03v2-release
        run: bash scripts/verify-release-bundle.sh

      - name: Check repository variables
        run: |
          problems=()
          for v in GCP_PROJECT_ID GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOY_SERVICE_ACCOUNT; do
            if [[ -z "${!v}" ]]; then
              problems+=("$v is not set")
            fi
          done
          if [[ -n "$GCP_PROJECT_ID" && ! "$GCP_PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]; then
            problems+=("GCP_PROJECT_ID is not a Google Cloud project ID")
          fi
          if [[ -n "$GCP_WORKLOAD_IDENTITY_PROVIDER" && ! "$GCP_WORKLOAD_IDENTITY_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/tx03v2-github/providers/github$ ]]; then
            problems+=("GCP_WORKLOAD_IDENTITY_PROVIDER is not the tx03v2 GitHub Workload Identity Federation provider")
          fi
          if [[ -n "$GCP_DEPLOY_SERVICE_ACCOUNT" && "$GCP_DEPLOY_SERVICE_ACCOUNT" != "dx03v2-gha-deploy@$GCP_PROJECT_ID.iam.gserviceaccount.com" ]]; then
            problems+=("GCP_DEPLOY_SERVICE_ACCOUNT is not the dx03v2 deploy identity in GCP_PROJECT_ID")
          fi
          if (("${#problems[@]}" > 0)); then
            printf '::error::Repository variable problem: %s\n' "${problems[@]}"
            echo "::error::Settings > Secrets and variables > Actions > Variables; see docs/RUNBOOK.md (section 'Variáveis do GitHub')."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install pinned kubectl and crane
        run: |
          bash scripts/install-tools.sh kubectl
          bash scripts/install-crane.sh
          printf '%s/.tools/bin\n' "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"

      # Workload Identity Federation only; the release was verified before this short-lived token is issued.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '588.0.0'
          install_components: gke-gcloud-auth-plugin

      - name: Promote the verified image digests to Artifact Registry (no rebuild)
        id: promote
        env:
          RELEASE_DIR: ${{ runner.temp }}/dx03v2-release
        run: bash scripts/deploy-gcp.sh --promote-only

      - name: Authenticate to Artifact Registry for promotion attestations
        env:
          REGISTRY_HOST: ${{ steps.promote.outputs.registry_host }}
        run: gcloud auth print-access-token | docker login "$REGISTRY_HOST" --username oauth2accesstoken --password-stdin

      - name: Write the Artifact Registry promotion predicates
        env:
          RELEASE_DIR: ${{ runner.temp }}/dx03v2-release
          API_AR_NAME: ${{ steps.promote.outputs.api_name }}
          API_AR_DIGEST: ${{ steps.promote.outputs.api_digest }}
          WEB_AR_NAME: ${{ steps.promote.outputs.web_name }}
          WEB_AR_DIGEST: ${{ steps.promote.outputs.web_digest }}
        run: bash scripts/write-promotion-statements.sh

      - name: Attest the promoted API image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.promote.outputs.api_name }}
          subject-digest: ${{ steps.promote.outputs.api_digest }}
          predicate-type: https://github.com/maringelix/tx00v2/attestations/promoted-image/v1
          predicate-path: ${{ runner.temp }}/dx03v2-promotion/api.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest the promoted web image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.promote.outputs.web_name }}
          subject-digest: ${{ steps.promote.outputs.web_digest }}
          predicate-type: https://github.com/maringelix/tx00v2/attestations/promoted-image/v1
          predicate-path: ${{ runner.temp }}/dx03v2-promotion/web.json
          push-to-registry: true
          create-storage-record: false

      - name: Verify the promotion signatures, workflow identity, and source commit
        env:
          API_AR_NAME: ${{ steps.promote.outputs.api_name }}
          API_AR_DIGEST: ${{ steps.promote.outputs.api_digest }}
          WEB_AR_NAME: ${{ steps.promote.outputs.web_name }}
          WEB_AR_DIGEST: ${{ steps.promote.outputs.web_digest }}
        run: |
          set -euo pipefail
          expected_workflow="$GITHUB_REPOSITORY/.github/workflows/deploy-gcp.yml"
          predicate_type='https://github.com/maringelix/tx00v2/attestations/promoted-image/v1'
          for component in api web; do
            image_name_var="${component^^}_AR_NAME"
            image_digest_var="${component^^}_AR_DIGEST"
            image_name="${!image_name_var}"
            image_digest="${!image_digest_var}"
            gh attestation verify "oci://$image_name@$image_digest" \
              --repo "$GITHUB_REPOSITORY" \
              --predicate-type "$predicate_type" \
              --signer-workflow "$expected_workflow" \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              --source-ref refs/heads/main \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done

      - name: Deploy the now-attested image digests
        env:
          RELEASE_DIR: ${{ runner.temp }}/dx03v2-release
        run: bash scripts/deploy-gcp.sh

      - name: Remove the Artifact Registry credentials
        if: always()
        env:
          REGISTRY_HOST: ${{ steps.promote.outputs.registry_host }}
        run: |
          if [[ -n "$REGISTRY_HOST" ]]; then docker logout "$REGISTRY_HOST"; fi
