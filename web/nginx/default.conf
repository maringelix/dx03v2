# dx03v2 web server (nginx-unprivileged, port 8080, non-root, read-only root filesystem: the
# image keeps pid and temp files in /tmp). Serves the SPA and proxies /api/ to the API service.

# HSTS only when the client reached the edge (Application Gateway for Containers on Azure) over
# HTTPS. Over plain HTTP the value stays empty and nginx omits the header.
map $http_x_forwarded_proto $hsts_header {
    default "";
    https   "max-age=31536000; includeSubDomains";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # The API rejects bodies over 10 kb with a JSON 413; nginx only stops abuse well above that.
    client_max_body_size 64k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Liveness/readiness of the web container itself (no dependency on the API).
    location = /healthz {
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        # The API sets its own versions of these headers; hide them so each appears once.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Strict-Transport-Security;

        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Appends the address nginx saw; the API trusts exactly one hop (TRUST_PROXY_HOPS=1).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        # Upstream down or too slow: answer in the API's JSON error format instead of HTML.
        error_page 502 503 504 = @api_unavailable;
        error_page 413 = @payload_too_large;
    }

    location @api_unavailable {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/json;
        return 503 '{"error":{"code":"api_unavailable","message":"API is unavailable, try again later","requestId":"$request_id"}}\n';
    }

    location @payload_too_large {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/json;
        return 413 '{"error":{"code":"payload_too_large","message":"Request body exceeds 10 kb","requestId":"$request_id"}}\n';
    }

    # Vite emits content-hashed file names under /assets/: cache them for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA: unknown paths fall back to index.html, which is never cached.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
