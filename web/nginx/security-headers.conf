# Security headers for every response, included in EVERY location of default.conf: nginx drops
# inherited add_header directives in any location that declares its own (the classic pitfall),
# and `always` also covers 4xx/5xx responses.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# Empty unless the request reached the edge over HTTPS (see the map in default.conf):
# nginx does not send a header whose value is empty, so plain HTTP never gets HSTS.
add_header Strict-Transport-Security $hsts_header always;
