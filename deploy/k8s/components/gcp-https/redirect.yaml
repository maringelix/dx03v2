# The HTTP listener of the full profile only redirects: 301 to the same hostname over HTTPS, with no
# backend of the app behind port 80.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dx03v2-http-redirect
spec:
  parentRefs:
    - name: dx03v2
      sectionName: http
  hostnames:
    - replaced-from-deploy-params
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
