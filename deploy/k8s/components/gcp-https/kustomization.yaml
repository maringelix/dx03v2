# HTTPS of the profile full (tx03v2 contract version 4). The Google-managed certificate of the fork owner's
# domain lives in a Certificate Manager Certificate Map (contract key dns/certificate-map): the Gateway names
# the map in an annotation and has no TLS section, no Kubernetes Secret and no certificate to renew. The
# HTTPS listener serves the app on the contract hostname (dns/hostname) and the HTTP listener only redirects
# to it. The values come from the Parameter Manager parameter through params.env.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
labels:
  - pairs:
      app.kubernetes.io/part-of: dx03v2
    includeSelectors: false
    includeTemplates: true
resources:
  - redirect.yaml
patches:
  - target:
      kind: Gateway
      name: dx03v2
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          networking.gke.io/certmap: replaced-from-deploy-params
      - op: add
        path: /spec/listeners/0/hostname
        value: replaced-from-deploy-params
      - op: add
        path: /spec/listeners/-
        value:
          name: https
          hostname: replaced-from-deploy-params
          protocol: HTTPS
          port: 443
          allowedRoutes:
            namespaces:
              from: Same
  - target:
      kind: HTTPRoute
      name: dx03v2
    patch: |-
      - op: replace
        path: /spec/parentRefs/0/sectionName
        value: https
      - op: add
        path: /spec/hostnames
        value:
          - replaced-from-deploy-params
replacements:
  - source:
      kind: ConfigMap
      name: deploy-params
      fieldPath: data.DNS_HOSTNAME
    targets:
      - select:
          kind: Gateway
          name: dx03v2
        fieldPaths:
          - spec.listeners.0.hostname
          - spec.listeners.1.hostname
      - select:
          kind: HTTPRoute
          name: dx03v2
        fieldPaths:
          - spec.hostnames.0
      - select:
          kind: HTTPRoute
          name: dx03v2-http-redirect
        fieldPaths:
          - spec.hostnames.0
  - source:
      kind: ConfigMap
      name: deploy-params
      fieldPath: data.CERT_MAP
    targets:
      - select:
          kind: Gateway
          name: dx03v2
        fieldPaths:
          - metadata.annotations.[networking.gke.io/certmap]
