# Edge of the local lab: a Gateway API Gateway of class istio (the local twin of the GKE Gateway with the
# GatewayClass gke-l7-global-external-managed), exposed by the load balancer emulator of tx03v2.
# HTTPS with a certificate cert-manager issues from the ClusterIssuer lab-ca (on Google Cloud the
# listener is HTTP for now, HTTPS planned); HTTP only redirects. /api goes straight to the API, like the
# HTTPRoute of the gcp component; everything else to web (nginx). The tx03v2 EnvoyFilter
# gateway-preserve-request-id keeps an external X-Request-Id (the Google load balancer docs do not say
# what it does with one: SMOKE_EDGE=gke only checks that it is safe).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: dx03v2
  annotations:
    cert-manager.io/cluster-issuer: lab-ca
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: dx03v2.tx03v2.local
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: dx03v2.tx03v2.local
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - name: dx03v2-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dx03v2-redirect
spec:
  parentRefs:
    - name: dx03v2
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dx03v2
spec:
  parentRefs:
    - name: dx03v2
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: api
          port: 3000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web
          port: 8080
