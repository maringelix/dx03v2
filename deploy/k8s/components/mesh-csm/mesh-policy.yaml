# Identity-based authorization of the exercise. The trust domain of Cloud Service Mesh is
# <project>.svc.id.goog, not cluster.local, so principals are matched by their namespace and service
# account (the same form as the policies that tx03v2 applies to web and api). PeerAuthentication
# STRICT of the namespace (tx03v2) makes the identity unforgeable: the intruder has a valid mesh
# identity and is refused because no rule names it.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: mesh-demo
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mesh-demo
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - '*/ns/dx03v2/sa/mesh-probe'
      to:
        - operation:
            ports: ['3000']
            methods: [GET]
            paths: ['/variant', '/fail', '/healthz']
