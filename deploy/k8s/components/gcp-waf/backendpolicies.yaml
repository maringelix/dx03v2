# Contract: the Cloud Armor security policy of tx03v2 (Standard tier: preconfigured WAF rules
# sqli-v33-stable and xss-v33-stable in deny(403), the first 64 KB of each body inspected), attached
# to the backend services that the Gateway creates for both Services of the HTTPRoute. Its name
# comes from the Parameter Manager key waf/security-policy; with the literal `none` (tx03v2
# enable_waf = false) scripts/deploy-gcp.sh renders overlays/gcp, which has no GCPBackendPolicy,
# and deletes stale ones.
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
spec:
  default:
    securityPolicy: replaced-from-deploy-params
  targetRef:
    group: ''
    kind: Service
    name: api
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
spec:
  default:
    securityPolicy: replaced-from-deploy-params
  targetRef:
    group: ''
    kind: Service
    name: web
