# Optional Cloud Armor policy (contract v1: only when the Parameter Manager key waf/security-policy
# is not the literal `none`). Use after components/gcp, which provides the deploy-params ConfigMap
# (WAF_SECURITY_POLICY).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
labels:
  - pairs:
      app.kubernetes.io/part-of: dx03v2
    includeSelectors: false
    includeTemplates: true
resources:
  - backendpolicies.yaml
replacements:
  - source:
      kind: ConfigMap
      name: deploy-params
      fieldPath: data.WAF_SECURITY_POLICY
    targets:
      - select:
          kind: GCPBackendPolicy
          name: api
        fieldPaths:
          - spec.default.securityPolicy
      - select:
          kind: GCPBackendPolicy
          name: web
        fieldPaths:
          - spec.default.securityPolicy
