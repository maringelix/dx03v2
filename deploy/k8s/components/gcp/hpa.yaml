# API autoscaling on CPU (GKE runs the metrics server in every cluster, Autopilot included).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 15
      policies: [{ type: Pods, value: 2, periodSeconds: 15 }]
    scaleDown:
      stabilizationWindowSeconds: 180
      policies: [{ type: Pods, value: 1, periodSeconds: 60 }]
