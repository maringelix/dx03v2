# Contract v1: the GKE Gateway controller (managed by Google, nothing to install) programs a global
# external Application Load Balancer for this Gateway, on the global IPv4 address that tx03v2
# reserves (Parameter Manager key gateway/address-name, referenced as a NamedAddress). HTTP on port
# 80 only: HTTPS needs a certificate and is planned.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: dx03v2
  labels:
    app.kubernetes.io/name: dx03v2
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses:
    - type: NamedAddress
      value: replaced-from-deploy-params
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
# /api goes straight to the API (behind the load balancer: TRUST_PROXY_HOPS=2), everything else to
# the web. Gateway API picks the longest matching path prefix, so the order of the rules does not
# matter.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dx03v2
  labels:
    app.kubernetes.io/name: dx03v2
spec:
  parentRefs:
    - name: dx03v2
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: api
          port: 3000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web
          port: 8080
