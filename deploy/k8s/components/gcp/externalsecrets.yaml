# Contract v1: External Secrets Operator (installed by tx03v2) copies the Secret Manager secrets
# into the Secrets the pods read, through the ClusterSecretStore gcp-secret-manager (the ESO
# controller's own Workload Identity Federation for GKE principal, with
# roles/secretmanager.secretAccessor on these two secrets only). tx03v2-lab-db-app holds JSON: each
# property becomes one DB_* key. The latest secret version is read. The deployer Role may only
# read Secrets; ESO writes them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: db-credentials
    creationPolicy: Owner
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: tx03v2-lab-db-app
        property: host
    - secretKey: DB_PORT
      remoteRef:
        key: tx03v2-lab-db-app
        property: port
    - secretKey: DB_NAME
      remoteRef:
        key: tx03v2-lab-db-app
        property: dbname
    - secretKey: DB_USER
      remoteRef:
        key: tx03v2-lab-db-app
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: tx03v2-lab-db-app
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: app-secrets
    creationPolicy: Owner
  data:
    - secretKey: ADMIN_TOKEN
      remoteRef:
        key: tx03v2-lab-app-admin-token
