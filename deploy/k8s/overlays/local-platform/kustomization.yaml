# The local lab of tx03v2 (kind + the full platform). Rendered by scripts/deploy-local.sh from a
# temporary copy that contains components/local-platform/params.env, committed to the GitOps
# repository of the lab git server and applied by Argo CD (AppProject dx03v2).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dx03v2
resources:
  - ../../base
components:
  - ../../components/local-platform
  - ../../components/mesh-full
