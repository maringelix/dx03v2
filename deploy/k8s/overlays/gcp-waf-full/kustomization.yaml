apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dx03v2
resources:
  - ../../base
  - gitops-revision.yaml
components:
  - ../../components/gcp
  - ../../components/gcp-https
  - ../../components/gcp-waf
  - ../../components/mesh-csm
